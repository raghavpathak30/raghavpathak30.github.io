  (function() {
    var overlay = document.getElementById('boot-overlay');
    if (!overlay) return;

    // Hard failsafe: no matter what else on this page fails — a thrown error,
    // a stalled network fetch, requestAnimationFrame getting throttled/paused
    // in a backgrounded tab — the overlay is force-dismissed after a fixed
    // timeout. This timer is armed before any other logic below runs.
    var failsafeMs = 2000;
    var failsafeTimer = setTimeout(forceDismiss, failsafeMs);

    function forceDismiss() {
      clearTimeout(failsafeTimer);
      overlay.classList.add('boot-fade-out');
      overlay.style.display = 'none';
      try { sessionStorage.setItem('portfolio_boot_seen', 'true'); } catch (e) {}
    }

    try {
      runBootSequence();
    } catch (e) {
      forceDismiss();
    }

    function runBootSequence() {

    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var hasBooted = false;
    try {
      hasBooted = sessionStorage.getItem('portfolio_boot_seen') === 'true';
    } catch (e) {}

    var urlParams = new URLSearchParams(window.location.search);
    var forceReboot = urlParams.get('reboot') === 'true';

    if ((hasBooted && !forceReboot) || reduceMotion) {
      clearTimeout(failsafeTimer);
      overlay.style.display = 'none';
      try { sessionStorage.setItem('portfolio_boot_seen', 'true'); } catch (e) {}
      return;
    }

    overlay.style.display = 'flex';

    var scrambleEl = document.getElementById('boot-scramble-line');
    var barEl = document.getElementById('boot-progress-bar');
    var counterEl = document.getElementById('boot-counter');
    var logEl = document.getElementById('boot-log');

    var isDone = false;
    var startTime = performance.now();
    var duration = 1700;

    var targetWords = ['DECRYPTING', 'CALIBRATING', 'SYSTEM READY'];
    var glyphs = '0123456789ABCDEF!@#$%&*';

    var logLines = [
      'INITIALIZE CORE SYSTEM',
      'LOAD CRYPTOGRAPHIC CONTEXT',
      'VERIFY MEASUREMENT PROVENANCE',
      'SYNC PROJECT INDEX',
      'CALIBRATE TIMING-SAFE PRIMITIVES',
      'SYSTEM READY'
    ];
    var loggedCount = 0;

    function appendLogLines(upTo) {
      while (loggedCount < upTo && loggedCount < logLines.length) {
        var line = document.createElement('div');
        line.className = 'boot-log-line';
        var idx = document.createElement('span');
        idx.className = 'boot-log-idx';
        idx.textContent = String(loggedCount + 1).padStart(3, '0');
        var text = document.createElement('span');
        text.textContent = logLines[loggedCount];
        line.appendChild(idx);
        line.appendChild(text);
        if (logEl) logEl.appendChild(line);
        loggedCount++;
      }
    }

    function finish() {
      if (isDone) return;
      isDone = true;
      clearTimeout(failsafeTimer);

      if (barEl) barEl.style.width = '100%';
      if (counterEl) counterEl.textContent = '100%';
      if (scrambleEl) scrambleEl.textContent = 'SYSTEM READY';
      appendLogLines(logLines.length);

      try {
        sessionStorage.setItem('portfolio_boot_seen', 'true');
      } catch (e) {}

      overlay.classList.add('boot-fade-out');
      setTimeout(function() {
        overlay.style.display = 'none';
      }, 350);
    }

    function frame(now) {
      if (isDone) return;
      var elapsed = now - startTime;
      var progress = Math.min(elapsed / duration, 1);

      var ease = 1 - Math.pow(1 - progress, 2);
      var currentPct = Math.floor(ease * 100);

      if (barEl) barEl.style.width = currentPct + '%';
      if (counterEl) counterEl.textContent = currentPct + '%';

      appendLogLines(Math.ceil(progress * logLines.length));

      var wordIndex = Math.min(Math.floor(progress * targetWords.length), targetWords.length - 1);
      var targetWord = targetWords[wordIndex];

      if (progress >= 0.95) {
        if (scrambleEl) scrambleEl.textContent = 'SYSTEM READY';
      } else if (Math.random() < 0.35 && scrambleEl) {
        var scrambled = '';
        for (var i = 0; i < targetWord.length; i++) {
          scrambled += Math.random() < 0.4 ? glyphs[Math.floor(Math.random() * glyphs.length)] : targetWord[i];
        }
        scrambleEl.textContent = scrambled;
      }

      if (progress < 1) {
        requestAnimationFrame(frame);
      } else {
        setTimeout(finish, 200);
      }
    }

    requestAnimationFrame(frame);

    overlay.addEventListener('click', finish);
    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' || e.code === 'Escape') {
        finish();
      }
    });

    } // end runBootSequence
  })();

  (function() {
    var lantern = document.getElementById('lantern-glow');

    var canHover = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;

    // --- Warm lantern light, gently trailing the cursor ---
    if (canHover && !reduceMotion) {
      var lx = window.innerWidth / 2;
      var ly = window.innerHeight * 0.35;
      var tx = lx;
      var ty = ly;
      var rafId = null;

      window.addEventListener('mousemove', function(e) {
        tx = e.clientX;
        ty = e.clientY;
        lantern.classList.add('is-lit');
      }, { passive: true });

      window.addEventListener('mouseleave', function() {
        lantern.classList.remove('is-lit');
      }, { passive: true });

      function tick() {
        lx += (tx - lx) * 0.045;

        lantern.style.transform = 'translate3d(' + (lx - 260) + 'px, ' + (ly - 260) + 'px, 0)';
        rafId = requestAnimationFrame(tick);
      }

      document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
          if (rafId) cancelAnimationFrame(rafId);
          rafId = null;
        } else if (!rafId) {
          rafId = requestAnimationFrame(tick);
        }
      });

      rafId = requestAnimationFrame(tick);
    } else {
      lantern.style.display = 'none';
    }

    // --- Slow parallax drift on the paper grain as the page scrolls ---
    if (!reduceMotion) {
      var ticking = false;
      window.addEventListener('scroll', function() {

          wrapper.style.setProperty('--parallax-y', offset.toFixed(1) + 'px');
          ticking = false;
        });
      }, { passive: true });
    }
  })();

  (function() {
    window.setPortfolioTheme = function(theme) {
      if (!theme || !['modern', 'matrix', 'amber', 'nord'].includes(theme)) theme = 'modern';
      if (theme === 'modern') {
        document.documentElement.removeAttribute('data-theme');
        document.documentElement.setAttribute('data-theme', 'modern');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
      }
      try { localStorage.setItem('portfolio-theme', theme); } catch (e) {}

      document.querySelectorAll('.btn-theme, .btn-theme-pill').forEach(function(btn) {
        if (btn.getAttribute('data-theme-val') === theme) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    };

    window.cycleTheme = function() {
      var themes = ['modern', 'amber', 'nord', 'matrix'];
      var current = document.documentElement.getAttribute('data-theme') || 'modern';
      var idx = themes.indexOf(current);
      var next = themes[(idx + 1) % themes.length];
      window.setPortfolioTheme(next);
    };

    var targetTheme = 'modern';
    try {
      var savedTheme = localStorage.getItem('portfolio-theme');
      if (savedTheme && ['modern', 'matrix', 'amber', 'nord'].includes(savedTheme)) targetTheme = savedTheme;
    } catch (e) {}
    if (targetTheme !== 'modern') document.documentElement.setAttribute('data-theme', targetTheme);

    document.addEventListener('DOMContentLoaded', function() {
      window.setPortfolioTheme(targetTheme);
    });
  })();

  (function() {
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function reveal(el) {
      el.classList.add('is-visible');
    }

    function draw(el) {
      el.classList.add('is-drawn');
    }

    function init() {
      var revealEls = document.querySelectorAll('[data-reveal]');
      var drawEls = document.querySelectorAll('[data-draw-line]');

      if (reduceMotion || !('IntersectionObserver' in window)) {
        revealEls.forEach(reveal);
        drawEls.forEach(draw);
        return;
      }

      var observer = new IntersectionObserver(function(entries, obs) {
        entries.forEach(function(entry) {
          if (!entry.isIntersecting) return;
          if (entry.target.hasAttribute('data-reveal')) reveal(entry.target);
          if (entry.target.hasAttribute('data-draw-line')) draw(entry.target);
          obs.unobserve(entry.target);
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

      revealEls.forEach(function(el) { observer.observe(el); });
      drawEls.forEach(function(el) { observer.observe(el); });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
